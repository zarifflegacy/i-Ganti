        // Fungsi mengesan minggu semasa berdasarkan tarikh
        function detectWeekIdFromDate(dateStr) {
            if (!dateStr) return store.selectedWeekId;
            const targetTime = new Date(dateStr).getTime();
            const found = store.weeks.find(w => {
                const start = new Date(w.startDate).getTime();
                const end = new Date(w.endDate).getTime();
                return targetTime >= start && targetTime <= end;
            });
            if (found) return found.id;
            const d = new Date(dateStr);
            const startOfYear = new Date(d.getFullYear(), 0, 1);
            const diffDays = Math.floor((d - startOfYear) / (24 * 60 * 60 * 1000));
            const weekNum = Math.min(Math.max(Math.ceil((diffDays + 1) / 7), 1), store.weeks.length);
            return `W${weekNum}`;
        }

        // Set minggu semasa secara automatik pada permulaan
        store.selectedWeekId = detectWeekIdFromDate(todayStr);

        // ==========================================
        // FUNGSI PENGESANAN & PENYIMPANAN BACKEND APPSCRIPT
        // ==========================================
        async function checkAppsScriptConnection(silent = false) {
            store.isCheckingBackend = true;
            if (!silent && store.currentUser?.role === 'superadmin') renderApp();
            
            if (!API_URL || API_URL === "PASTE_APPS_SCRIPT_URL" || !API_URL.startsWith("http")) {
                store.isBackendConnected = false;
                store.isCheckingBackend = false;
                store.lastCheckedBackend = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (store.currentUser?.role === 'superadmin') renderApp();
                if (!silent) showToast("URL Apps Script belum dikonfigurasi (Terputus).", "error");
                return false;
            }
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const separator = API_URL.includes('?') ? '&' : '?';
                const response = await fetch(`${API_URL}${separator}action=ping`, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (response.ok) {
                    const data = await response.json();
                    if (data && (data.status === 'success' || data.connected === true)) {
                        store.isBackendConnected = true;
                        store.lastCheckedBackend = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        if (!silent) showToast("Berjaya disambungkan ke Google Sheet Apps Script!", "success");
                        if (data.data) {
                            syncStoreWithBackend(data.data);
                            renderApp();
                        }
                    } else {
                        store.isBackendConnected = false;
                        if (!silent) showToast("Respon Apps Script tidak sah.", "error");
                    }
                } else {
                    store.isBackendConnected = false;
                    if (!silent) showToast("Gagal menghubungi pelayan Google Apps Script.", "error");
                }
            } catch (error) {
                store.isBackendConnected = false;
                if (!silent) showToast("Sambungan ke Google Apps Script gagal / terputus.", "error");
            } finally {
                store.isCheckingBackend = false;
                store.lastCheckedBackend = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (store.currentUser?.role === 'superadmin') renderApp();
            }
            return store.isBackendConnected;
        }

        function syncStoreWithBackend(backendData) {
            if (!backendData) return;
            if (Array.isArray(backendData.schools) && backendData.schools.length > 0) store.schools = backendData.schools;
            if (Array.isArray(backendData.payments) && backendData.payments.length > 0) store.payments = backendData.payments;
            if (Array.isArray(backendData.teachers) && backendData.teachers.length > 0) store.teachers = backendData.teachers;
            if (Array.isArray(backendData.classes) && backendData.classes.length > 0) store.classes = backendData.classes;
            if (Array.isArray(backendData.timetable) && backendData.timetable.length > 0) store.timetable = backendData.timetable;
            if (Array.isArray(backendData.absences) && backendData.absences.length > 0) store.absences = backendData.absences;
            if (Array.isArray(backendData.reliefList) && backendData.reliefList.length > 0) store.reliefList = backendData.reliefList;
            if (Array.isArray(backendData.subjects) && backendData.subjects.length > 0) store.subjects = backendData.subjects;
            if (Array.isArray(backendData.timeSlots) && backendData.timeSlots.length > 0) store.timeSlots = backendData.timeSlots;
            if (Array.isArray(backendData.weeks) && backendData.weeks.length > 0) store.weeks = backendData.weeks;
            if (backendData.settings) {
                if (backendData.settings.appName) store.appName = backendData.settings.appName;
                if (backendData.settings.appDesc) store.appDesc = backendData.settings.appDesc;
                if (backendData.settings.appLogo) store.appLogo = backendData.settings.appLogo;
                if (backendData.settings.bankName) store.bankInfo.bankName = backendData.settings.bankName;
                if (backendData.settings.accountName) store.bankInfo.accountName = backendData.settings.accountName;
                if (backendData.settings.accountNo) store.bankInfo.accountNo = backendData.settings.accountNo;
                if (backendData.settings.qrCode) store.bankInfo.qrCode = backendData.settings.qrCode;
            }
        }

        async function pushToBackend(action, payload) {
            if (!API_URL || API_URL === "PASTE_APPS_SCRIPT_URL" || !API_URL.startsWith("http")) return;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({ action, payload })
                });
                if (res.ok) {
                    const result = await res.json();
                    if (result && result.status === 'success') {
                        store.isBackendConnected = true;
                        store.lastCheckedBackend = new Date().toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                }
            } catch (e) {
                store.isBackendConnected = false;
            }
        }
        
        // HELPER UTILITIES
        function parseGoogleDriveUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/u/0/d/${match[1]}`;
                }
            }
            return url;
        }
        function getRealFormattedDate() {
            const days = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
            const now = new Date();
            return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        function getDayNameFromDate(dateString) {
            const days = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const [y, m, d] = dateString.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            return days[dateObj.getDay()];
        }
        function getYearFromDate(dateString) {
            if (!dateString) return store.selectedYear;
            return parseInt(dateString.split('-')[0], 10);
        }
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            
            msgEl.textContent = message;
            if (type === 'success') {
                iconEl.className = 'fas fa-check-circle text-emerald-400 text-lg';
            } else if (type === 'error') {
                iconEl.className = 'fas fa-exclamation-circle text-red-400 text-lg';
            } else {
                iconEl.className = 'fas fa-info-circle text-brand-400 text-lg';
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
        function showConfirm(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const modalContent = document.getElementById('confirm-modal-content');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            const okBtn = document.getElementById('confirm-ok-btn');
            const cleanup = () => {
                modalContent.classList.remove('scale-100', 'opacity-100');
                modalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 200);
                cancelBtn.onclick = null;
                okBtn.onclick = null;
            };
            cancelBtn.onclick = cleanup;
            okBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
        }

        // ==========================================
        // HELPER PENGIRAAN MASA MENGAJAR HAKIKI & GANTI (SYNC JADUAL WAKTU INDUK SEKOLAH)
        // ==========================================
        function getTeacherHakikiSlotsForYear(teacherObj, year) {
            const timetableEntries = store.timetable.filter(tt => 
                Number(tt.year || 2026) === Number(year) && 
                tt.teacherName.trim().toLowerCase() === teacherObj.name.trim().toLowerCase()
            );
            if (timetableEntries.length > 0) {
                return timetableEntries.length;
            }
            return Number(year) === 2026 ? (Number(teacherObj.teachingSlots) || 0) : 0;
        }

        // Mengira secara tepat bilangan slot guru dalam Jadual Waktu Induk Sekolah pada hari semasa
        function getTeacherHakikiSlotsForDay(teacherObj, dayName, year) {
            const yearTimetable = store.timetable.filter(tt => 
                Number(tt.year || 2026) === Number(year) && 
                tt.teacherName.trim().toLowerCase() === teacherObj.name.trim().toLowerCase()
            );

            // Jika guru mempunyai rekod dalam Jadual Waktu Induk Sekolah untuk tahun tersebut,
            // pulangkan jumlah sebenar slot pada hari berkenaan (termasuk 0 jika hari itu tiada kelas)
            if (yearTimetable.length > 0) {
                return yearTimetable.filter(tt => tt.day === dayName).length;
            }

            // Fallback hanya jika Jadual Waktu Induk Sekolah belum diisi langsung bagi guru tersebut
            const totalYearHakiki = getTeacherHakikiSlotsForYear(teacherObj, year);
            if (totalYearHakiki > 0 && ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat'].includes(dayName)) {
                return Math.round(totalYearHakiki / 5);
            }
            return 0;
        }

        function saveSchoolForm(e, schoolId) {
            e.preventDefault();
            const name = document.getElementById('m-school-name').value;
            const code = document.getElementById('m-school-code').value;
            const phone = document.getElementById('m-school-phone').value;
            const email = document.getElementById('m-school-email').value;
            const address = document.getElementById('m-school-address').value;
            const adminName = document.getElementById('m-admin-name').value;
            const ic = document.getElementById('m-admin-ic').value;
            const pass = document.getElementById('m-admin-pass').value;
            const status = document.getElementById('m-school-status').value;
            const daysLeft = parseInt(document.getElementById('m-school-days').value) || 0;
            let payloadObj;
            if (schoolId && schoolId !== 'null') {
                const school = store.schools.find(s => s.id === schoolId);
                if (school) {
                    Object.assign(school, { name, code, phone, email, address, adminName, ic, pass, status, daysLeft });
                    payloadObj = school;
                }
            } else {
                payloadObj = {
                    id: 'SK' + Date.now(),
                    name, code, phone, email, address, adminName, ic, pass, status, daysLeft, totalTeachers: 0
                };
                store.schools.push(payloadObj);
            }
            pushToBackend('saveSchool', payloadObj);
            document.getElementById('school-form-modal').remove();
            renderApp();
            showToast("Data sekolah berjaya dikemas kini!", "success");
        }

        function saveReceiptForm(e, payId) {
            e.preventDefault();
            const schoolName = document.getElementById('r-school-dropdown').value;
            const amount = parseFloat(document.getElementById('r-amount').value);
            const startDate = document.getElementById('r-start').value;
            const endDate = document.getElementById('r-end').value;
            const fileUrl = document.getElementById('r-file').value;
            const status = document.getElementById('r-status').value;
            let payObj;
            if (payId && payId !== 'null') {
                const pay = store.payments.find(p => p.id === payId);
                if (pay) {
                    Object.assign(pay, { schoolName, amount, startDate, endDate, fileUrl, status });
                    payObj = pay;
                }
            } else {
                const matchedSchool = store.schools.find(s => s.name === schoolName);
                payObj = {
                    id: 'PAY-' + Math.floor(1000 + Math.random() * 9000),
                    schoolCode: matchedSchool ? matchedSchool.code : 'SK-' + Math.floor(100 + Math.random() * 900),
                    schoolName,
                    amount,
                    startDate,
                    endDate,
                    fileUrl,
                    status
                };
                store.payments.push(payObj);
            }
            pushToBackend('savePayment', payObj);
            document.getElementById('receipt-modal').remove();
            renderApp();
            showToast("Resit langganan sekolah berjaya dikeluarkan!", "success");
        }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Template_Jadual_Waktu_${store.selectedYear}.csv`);

        function handleBulkCSVUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split('\n');
                let addedCount = 0;
                let errorCount = 0;
                const addedItems = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',');
                    if (cols.length >= 5) {
                        const [teacherName, day, slot, subject, className] = cols.map(c => c.trim());
                        
                        if (store.enableClashDetection) {
                            const isClassClash = store.timetable.some(tt => Number(tt.year || 2026) === Number(store.selectedYear) && tt.day === day && tt.slot === slot && tt.className === className);
                            const isTeacherClash = store.timetable.some(tt => Number(tt.year || 2026) === Number(store.selectedYear) && tt.day === day && tt.slot === slot && tt.teacherName === teacherName);
                            
                            if (isClassClash || isTeacherClash) {
                                errorCount++;
                                continue;
                            }
                        }
                        
                        const newEntry = {
                            id: 'TT' + Date.now() + Math.floor(Math.random() * 1000),
                            year: store.selectedYear,
                            teacherName,
                            day,
                            slot,
                            subject,
                            className
                        };
                        store.timetable.push(newEntry);
                        addedItems.push(newEntry);
                        addedCount++;
                    }
                }
                if (addedItems.length > 0) pushToBackend('bulkSaveTimetable', { entries: addedItems });
                renderApp();
                showToast(`Muat naik selesai! ${addedCount} entry ditambah. (${errorCount} ditolak kerana bertembung)`, addedCount > 0 ? "success" : "error");
            };
            reader.readAsText(file);
        }

        function saveTimetableEntry(e) {

            const subject = document.getElementById('tt-subject').value;
            const className = document.getElementById('tt-class').value;
            
            if (store.enableClashDetection) {
                const isClassClash = store.timetable.some(tt => 
                    Number(tt.year || 2026) === Number(store.selectedYear) &&
                    tt.day === day && 
                    tt.slot === slot && 
                    tt.className === className
                );
                if (isClassClash) {
                    showToast(`Ralat: Kelas ${className} sudah mempunyai subjek lain pada hari ${day} slot ${slot}!`, "error");
                    return;
                }
                const isTeacherClash = store.timetable.some(tt => 
                    Number(tt.year || 2026) === Number(store.selectedYear) &&
                    tt.day === day && 
                    tt.slot === slot && 
                    tt.teacherName === teacherName
                );
                if (isTeacherClash) {
                    showToast(`Ralat: Cikgu ${teacherName} sudah mengajar kelas lain pada hari ${day} slot ${slot}!`, "error");
                    return;
                }
            }
            
            const newEntry = {
                id: 'TT' + Date.now(),
                year: store.selectedYear,
                teacherName,
                day, slot, subject, className
            };
            store.timetable.push(newEntry);
            pushToBackend('saveTimetableEntry', newEntry);

            renderApp();
            showToast("Entry jadual berjaya ditambah!", "success");

        function autoUpdateReliefFromAbsences(targetDate) {
            const targetYear = getYearFromDate(targetDate);
            const targetWeekId = detectWeekIdFromDate(targetDate);
            const dayName = getDayNameFromDate(targetDate);
            const absentForDate = store.absences.filter(a => Number(a.year || getYearFromDate(a.date)) === Number(targetYear) && a.date === targetDate);
            store.reliefList = store.reliefList.filter(r => !(Number(r.year || getYearFromDate(r.date)) === Number(targetYear) && r.date === targetDate));
            if (absentForDate.length === 0) {
                pushToBackend('syncReliefDate', { date: targetDate, year: targetYear, reliefs: [] });
                return;
            }
            
            let updatedReliefs = [];
            absentForDate.forEach(abs => {
                const teacherSlots = store.timetable.filter(tt => Number(tt.year || 2026) === Number(targetYear) && tt.teacherName === abs.teacherName && tt.day === dayName);
                teacherSlots.forEach(slotItem => {
                    const timeSlotObj = store.timeSlots.find(ts => ts.slot === slotItem.slot);
                    const slotTimeStr = timeSlotObj ? timeSlotObj.time : '08:00 - 08:30';
                    const availableTeachers = store.teachers.filter(t => 
                        t.name !== abs.teacherName && 
                        !absentForDate.some(a => a.teacherName === t.name) &&
                        !store.timetable.some(tt => Number(tt.year || 2026) === Number(targetYear) && tt.teacherName === t.name && tt.day === dayName && tt.slot === slotItem.slot)
                    );
                    const substitute = availableTeachers.length > 0 
                        ? availableTeachers[Math.floor(Math.random() * availableTeachers.length)]
                        : store.teachers.find(t => t.name !== abs.teacherName) || { id: 'T99', name: 'Guru Bebas' };
                    updatedReliefs.push({
                        id: 'REL-' + Date.now() + Math.floor(Math.random() * 1000),
                        year: targetYear,
                        absentTeacherId: abs.teacherId,
                        absentTeacher: abs.teacherName,
                        date: targetDate,
                        weekId: targetWeekId,
                        slot: slotItem.slot,
                        time: slotTimeStr,
                        subject: slotItem.subject,
                        className: slotItem.className,
                        substituteId: substitute.id,
                        substituteName: substitute.name,
                        confirmedBySubstitute: false,
                        status: "Belum Disahkan"
                    });
                });
            });
            store.reliefList = store.reliefList.concat(updatedReliefs);
            pushToBackend('syncReliefDate', { date: targetDate, year: targetYear, reliefs: updatedReliefs });
        }

                        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                            <p class="text-xs font-bold text-slate-700 mb-2 flex items-center">
                                <i class="fas fa-chalkboard text-brand-600 mr-1.5"></i>Slot Mengajar Hakiki Anda Pada Hari ${selectedDayName} (Jadual Waktu Induk Sekolah):
                            </p>
                            ${myTodayMasterSlots.length > 0 ? `
                                <div class="flex flex-wrap gap-2">
                                    ${myTodayMasterSlots.map(s => {
                                        const tsObj = store.timeSlots.find(t => t.slot === s.slot);
                                        return `
                                            <span class="inline-flex items-center space-x-1.5 px-3 py-1 bg-white border border-brand-200 rounded-lg text-xs shadow-sm">
                                                <span class="font-mono font-extrabold text-brand-700">${s.slot}</span>
                                                <span class="text-slate-400 text-[10px]">(${tsObj ? tsObj.time : ''})</span>
                                                <span class="font-bold text-slate-800">• ${s.className} (${s.subject})</span>
                                            </span>
                                        `;
                                    }).join('')}
                                </div>
                            ` : `<p class="text-xs text-slate-400 italic">Tiada slot mengajar hakiki direkodkan dalam Jadual Waktu Induk Sekolah untuk hari ${selectedDayName}.</p>`}
                        </div>
                        
                        <!-- CARTA BEBANAN GURU DISINKRON MENGIKUT HARI, MINGGU & TAHUN -->
                        <div class="h-60">
                            <canvas id="singleTeacherWorkloadChart"></canvas>
                        </div>
                    </div>
                    
                    <!-- JADUAL WAKTU INDUK SEKOLAH -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base"><i class="fas fa-calendar-alt text-brand-600 mr-2"></i>Jadual Waktu Induk Sekolah (${activeYear})</h3>
                                <p class="text-xs text-slate-500">${store.teacherCanEditSchedule ? 'Anda dibenarkan oleh Admin Sekolah untuk mengemaskini jadual.' : 'Mod Lihat Sahaja (Kebenaran Mengemaskini Ditolak oleh Admin).'}</p>
                            </div>
                            ${store.teacherCanEditSchedule ? `
                                <button onclick="openAddSlotModal()" class="px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow-md">
                                    Kemaskini jadual
                                </button>
                            ` : ''}
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200">
                                        <th class="p-3 border border-slate-200 text-slate-700 font-extrabold uppercase w-28">Masa / Hari</th>
                                        ${days.map(day => `<th class="p-3 border border-slate-200 text-center font-extrabold ${day === selectedDayName ? 'bg-amber-100 text-amber-900 border-amber-300' : 'text-slate-800'}">${day} ${day === selectedDayName ? '★ (Hari Semasa)' : ''}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${store.timeSlots.map(slot => `
                                        <tr>
                                            <td class="p-2 border border-slate-200 font-bold bg-slate-50 text-brand-700 font-mono text-center">
                                                <div>${slot.slot}</div>
                                                <div class="text-[10px] text-slate-400">${slot.time}</div>
                                            </td>
                                            ${days.map(day => {
                                                const matchEntries = store.timetable.filter(tt => Number(tt.year || 2026) === Number(activeYear) && tt.day === day && tt.slot === slot.slot);
                                                const isTodayCol = day === selectedDayName;
                                                return `
                                                    <td class="p-2 border border-slate-200 text-center align-top min-w-[140px] ${isTodayCol ? 'bg-amber-50/40' : 'bg-white'} hover:bg-slate-50 transition-colors">
                                                        ${matchEntries.length > 0 ? matchEntries.map(e => {
                                                            const isMe = e.teacherName === realTeacherObj.name;
                                                            return `
                                                                <div class="p-2 mb-1.5 ${isMe ? 'bg-brand-100 border-brand-400 ring-2 ring-brand-500/30' : 'bg-slate-50 border-slate-200'} border rounded-xl text-left relative group">
                                                                    ${store.teacherCanEditSchedule ? `<button onclick="deleteTimetableEntry('${e.id}')" class="absolute top-1 right-1 text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity p-1"><i class="fas fa-times"></i></button>` : ''}
                                                                    <p class="font-extrabold ${isMe ? 'text-brand-900' : 'text-slate-800'}">${e.subject}</p>
                                                                    <p class="text-[11px] font-bold text-slate-700">${e.className}</p>
                                                                    <p class="text-[10px] text-slate-500 font-semibold truncate"><i class="fas fa-user-circle mr-1"></i>${e.teacherName}</p>
                                                                </div>
                                                            `;
                                                        }).join('') : '<span class="text-slate-300 italic text-[11px]">-</span>'}
                                                    </td>
                                                `;
                                            }).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }
        function confirmTeacherDuty(relId) {
            const rel = store.reliefList.find(r => r.id === relId);
            if (rel) {
                rel.confirmedBySubstitute = true;
                rel.status = "Disahkan";
                pushToBackend('saveRelief', rel);
                renderApp();
                showToast("Tugas guru ganti berjaya disahkan!", "success");
            }
        }
        function changeTeacherDutyDate(d) {
            store.teacherDutyDate = d;
            store.selectedYear = getYearFromDate(d);
            store.selectedWeekId = detectWeekIdFromDate(d);
            renderApp();
            showToast(`Disinkronkan: ${d} (${getDayNameFromDate(d)} | ${store.selectedWeekId} | Tahun ${store.selectedYear}).`);
        }
        function openTeacherSelfAbsenceModal() {
            const modalHtml = `
                <div id="teacher-self-abs-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b">
                            <h3 class="font-bold text-slate-900">Borang Ketidakhadiran Guru</h3>
                            <button onclick="document.getElementById('teacher-self-abs-modal').remove()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                        </div>
                        <form onsubmit="saveTeacherSelfAbsence(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block font-semibold mb-1">Tarikh Ketidakhadiran *</label>
                                <input type="date" id="t-abs-date" required value="${store.teacherDutyDate}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1">Sebab Ketidakhadiran (Secara Bertulis) *</label>
                                <textarea id="t-abs-reason" required rows="3" placeholder="Sila tulis sebab ketidakhadiran anda secara terperinci..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                            </div>
                            <div class="flex justify-end space-x-3 pt-4 border-t">
                                <button type="button" onclick="document.getElementById('teacher-self-abs-modal').remove()" class="px-4 py-2 text-slate-600 bg-slate-100 rounded-xl font-bold">Batal</button>
                                <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl font-bold shadow-md">Hantar Permohonan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
        function saveTeacherSelfAbsence(e) {
            e.preventDefault();
            const currentTeacher = store.currentUser.data;
            const date = document.getElementById('t-abs-date').value;
            const reason = document.getElementById('t-abs-reason').value;
            const entryYear = getYearFromDate(date);
            const absObj = {
                id: 'ABS-' + Date.now(),
                year: entryYear,
                teacherId: currentTeacher.id,
                teacherName: currentTeacher.name,
                date,
                reason,
                timestamp: new Date().toTimeString().substring(0, 5)
            };
            store.absences.push(absObj);
            pushToBackend('saveAbsence', absObj);
            autoUpdateReliefFromAbsences(date);
            document.getElementById('teacher-self-abs-modal').remove();
            showToast("Sebab ketidakhadiran dihantar & jadual ganti dikemaskini!", "success");
            renderApp();
        }
        
        // CHART INITIALIZATION
        function initCharts() {
            const wlCanvas = document.getElementById('teacherWorkloadChart');
            if (wlCanvas) {
                new Chart(wlCanvas.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: store.teachers.map(t => t.name.split(' ')[0]),
                        datasets: [
                            { 
                                label: `Masa Mengajar Hakiki (${store.selectedYear})`, 
                                data: store.teachers.map(t => getTeacherHakikiSlotsForYear(t, store.selectedYear)), 
                                backgroundColor: '#0284c7', 
                                borderRadius: 6 
                            },
                            { 
                                label: store.viewAllWeeksWorkload ? `Masa Ganti (Keseluruhan ${store.selectedYear})` : `Masa Ganti (${store.selectedWeekId} - ${store.selectedYear})`, 
                                data: store.teachers.map(t => store.reliefList.filter(r => 
                                    Number(r.year || getYearFromDate(r.date)) === Number(store.selectedYear) && 
                                    r.substituteName === t.name && 
                                    (store.viewAllWeeksWorkload || (r.weekId || detectWeekIdFromDate(r.date)) === store.selectedWeekId)
                                ).length), 
                                backgroundColor: '#f59e0b', 
                                borderRadius: 6 
                            }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            const stCanvas = document.getElementById('singleTeacherWorkloadChart');
            if (stCanvas && store.currentUser && store.currentUser.role === 'teacher') {
                const me = store.currentUser.data;
                const realTeacherObj = store.teachers.find(t => t.id === me.id || t.name === me.name) || me;
                const daysList = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat'];
                const activeYear = store.selectedYear;
                const selectedDayName = getDayNameFromDate(store.teacherDutyDate);
                
                const hakikiPerDay = daysList.map(dayName => getTeacherHakikiSlotsForDay(realTeacherObj, dayName, activeYear));
                const reliefPerDay = daysList.map(dayName => {
                    return store.reliefList.filter(r => 
                        Number(r.year || getYearFromDate(r.date)) === Number(activeYear) &&
                        r.substituteName === realTeacherObj.name &&
                        (r.weekId || detectWeekIdFromDate(r.date)) === store.selectedWeekId &&
                        getDayNameFromDate(r.date) === dayName
                    ).length;
                });

                new Chart(stCanvas.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: daysList.map(d => d === selectedDayName ? `${d} (Hari Semasa)` : d),
                        datasets: [
                            { 
                                label: `Waktu Hakiki Jadual Induk (${activeYear})`, 
                                data: hakikiPerDay, 
                                backgroundColor: daysList.map(d => d === selectedDayName ? '#0369a1' : '#38bdf8'), 
                                borderRadius: 6 
                            },
                            { 
                                label: `Waktu Ganti (${store.selectedWeekId} - ${activeYear})`, 
                                data: reliefPerDay, 
                                backgroundColor: daysList.map(d => d === selectedDayName ? '#d97706' : '#fbbf24'), 
                                borderRadius: 6 
                            }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }
        
        // INITIAL STARTUP
        window.onload = function() {
            renderApp();
            checkAppsScriptConnection(true);
            setInterval(() => {
                if (store.currentUser && store.currentUser.role === 'superadmin') {
                    checkAppsScriptConnection(true);
                }
            }, 30000);
        };
    </script>
</body>
</html>
